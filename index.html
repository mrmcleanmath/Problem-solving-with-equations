
<!doctype html>

<style>
:root{

  --border:#252d4a;--accent:#ffb400;--good:#3ac77a;--bad:#ff5b76;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:20px 14px 30px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(24px,3vw,34px)}
.subtitle{margin-top:5px;color:var(--muted);font-size:14px}
.tabs,.levels,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;background:#18203a;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
button.active,button.primary{background:var(--accent);border-color:var(--accent);color:#161000}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.question{white-space:pre-wrap;font-size:18px;line-height:1.55;padding:15px;border-radius:12px;background:var(--soft);border:1px solid var(--border);margin:12px 0 14px}
.answers{display:grid;gap:9px}
.answer-group{display:grid;gap:4px}
.answer-label{font-size:13px;color:var(--muted);font-weight:800}
input{font:inherit;font-size:18px;background:#090f20;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%}
.controls{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
.feedback{min-height:48px;margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px}
.feedback.ok{color:var(--good);font-weight:850}.feedback.bad{color:var(--bad);font-weight:850}
.correct-answer,.steps{display:none;margin-top:9px;padding:10px 12px;background:var(--soft);border:1px solid var(--border);border-radius:11px;white-space:pre-wrap}
.correct-answer.show,.steps.show{display:block}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stat{padding:7px 11px;border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:800}
.worksheet{display:none}
.ws-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select{font:inherit;background:#090f20;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px}
.ws-list{display:grid;gap:10px}
.ws-item{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:12px}
.ws-q{white-space:pre-wrap}
.ws-a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--good);font-weight:800;white-space:pre-wrap}
.ws-a.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media print{
  body{background:#fff;color:#000}.wrap{max-width:none;padding:0}
  header,#practiceCard,.no-print,.footer{display:none!important}
  #worksheetCard{display:block!important;background:#fff;color:#000;border:0;padding:0}
  .ws-item{background:#fff;color:#000;border-color:#000}
  .ws-a{display:none!important}
}
</style>

<body>
<div class="wrap">
<header>
  <div>
    <h1>Problem Solving with Equations</h1>
    <div class="subtitle">Write and solve an equation for each word problem.</div>
  </div>
  <div class="tabs">
    <button id="practiceTab" class="active" type="button">Practice</button>
    <button id="worksheetTab" type="button">Worksheet</button>
  </div>
</header>

<section id="practiceCard" class="card">
  <div class="toolbar">
    <div>
      <div class="label">Difficulty</div>
      <div class="levels">
        <button class="level active" data-diff="easy" type="button">Foundation</button>
        <button class="level" data-diff="medium" type="button">Core</button>

<section id="worksheetCard" class="card worksheet">
  <div class="ws-top">

      <div style="font-size:19px;font-weight:900">Worksheet</div>

    </div>
    <div class="row no-print">
      <label style="font-size:13px;font-weight:800">Questions
        <select id="wsCount"><option>5</option><option>10</option><option selected>15</option></select>
      </label>
      <button id="wsGenerate" class="primary" type="button">Generate</button>
      <button id="revealAll" type="button" disabled>Reveal All</button>
      <button id="hideAll" type="button" disabled>Hide All</button>
      <button id="printBtn" type="button" disabled>Print</button>
    </div>
  </div>
  <div id="wsList" class="ws-list"></div>
</section>

<div class="footer">Created by Mr. McLean Math.</div>
</div>

<script>
function randInt(min, max) {
return Math.floor(Math.random() * (max - min + 1)) + min;
}

function choice(arr) {
return arr[Math.floor(Math.random() * arr.length)];
}

function formatNumber(num) {
if (typeof num !== "number" || !isFinite(num)) return String(num);
const sign = num < 0 ? "-" : "";
const abs = Math.abs(num);
const fixed = Number.isInteger(abs) ? abs.toString() : abs.toString();
const parts = fixed.split(".");
let intPart = parts[0];
const frac = parts.length > 1 ? "." + parts[1] : "";
const regex = /\B(?=(\d{3})+(?!\d))/g;
intPart = intPart.replace(regex, " ");
return sign + intPart + frac;
}

function parseAnswer(value) {
if (value == null) return NaN;
const s = String(value)
.trim()
.replace(/\u00A0/g, " ")
.replace(/\s+/g, "")
.replace(",", ".");
if (s === "") return NaN;
return Number(s);
}

function formatAnswerList(problem) {
return problem.answers.map(a => `${a.label}: ${formatNumber(a.value)}`).join("\n");
}

function formatUserAnswerList(problem, values) {
return problem.answers.map((a, i) => `${a.label}: ${values[i]}`).join("\n");
}
function normalizeProblem(problem) {
if (!problem.answers) {
problem.answers = [{ label: "Answer", value: problem.answer }];
}
if (typeof problem.answer === "undefined") {
problem.answer = problem.answers[0].value;
}
return problem;
}

const easyGenerators = [
function(){
const a = choice([2,3,4,5]);
const b = randInt(1,10);
const targetQuotient = randInt(2,30);
const shownResult = targetQuotient + b;
const answer = targetQuotient * a;
const q = `If you divide a number by ${a} and then add ${b}, you get ${formatNumber(shownResult)}.\nWhat is the number?`;
const steps =
`Let the number be x.

x ÷ ${a} + ${b} = ${formatNumber(shownResult)}
x ÷ ${a} = ${formatNumber(shownResult)} - ${b} = ${formatNumber(shownResult - b)}
x = ${formatNumber(shownResult - b)} × ${a} = ${formatNumber(answer)}`;
return normalizeProblem({
question:q,
answer:answer,
steps,
tier:"easy"
});
},

function(){
const height = choice([4,5,6,8]);
const base = randInt(4,20);
const area = (base * height) / 2;
const q = `A triangle has an area of ${formatNumber(area)} cm² and a height of ${formatNumber(height)} cm.\nThe base is x cm long.\nHow long is the base?`;
const steps =
`Area of a triangle: A = (base × height) ÷ 2

${formatNumber(area)} = (x × ${formatNumber(height)}) ÷ 2
Multiply both sides by 2:
2 × ${formatNumber(area)} = x × ${formatNumber(height)}
x = (2 × ${formatNumber(area)}) ÷ ${formatNumber(height)} = ${formatNumber(base)} cm`;
return normalizeProblem({
question:q,
answer:base,
steps,
tier:"easy"
});
},

function(){
const sweet = randInt(2,7);
const iceCream = randInt(15,25);
const total = iceCream + 5 * sweet;
const q = `An ice cream and five pieces of candy cost ${formatNumber(total)} kr together.\nThe ice cream costs ${formatNumber(iceCream)} kr.\nHow much does one piece of candy cost?`;
const steps =
`Let x be the price of one piece of candy.

${formatNumber(iceCream)} + 5x = ${formatNumber(total)}
5x = ${formatNumber(total)} - ${formatNumber(iceCream)} = ${formatNumber(total-iceCream)}
x = ${formatNumber(total-iceCream)} ÷ 5 = ${formatNumber(sweet)} kr`;
return normalizeProblem({
question:q,
answer:sweet,
steps,
tier:"easy"
});
},

function(){
const x = randInt(2,8);
const w = x;
const l = 3*x;
const perimeter = 2*(w+l);
const q = `The width of a rectangle is x cm and the length is 3x cm.\nThe perimeter of the rectangle is ${formatNumber(perimeter)} cm.\nHow long is one of the short sides (the width)?`;
const steps =
`Perimeter P = 2 × (length + width)

${formatNumber(perimeter)} = 2 × (3x + x) = 2 × 4x = 8x
x = ${formatNumber(perimeter)} ÷ 8 = ${formatNumber(x)} cm`;
return normalizeProblem({
question:q,
answer:x,
steps,
tier:"easy"
});
},

function(){
const percent = choice([25, 40, 60]);
let total;

if (percent === 25) {
total = randInt(20, 80) * 4;
} else {
total = randInt(20, 80) * 5;
}

const trained = total * percent / 100;

const q = `In a survey, ${percent}% of the people said that they exercise regularly.\nThat corresponds to ${formatNumber(trained)} people.\nHow many people were in the survey in total?`;
const steps =
`Let N be the total number of people.

${percent}% of N = ${formatNumber(trained)}
${percent}/100 × N = ${formatNumber(trained)}
N = ${formatNumber(trained)} × 100 ÷ ${percent} = ${formatNumber(total)}`;
return normalizeProblem({
question:q,
answer:total,
steps,
tier:"easy"
});
},

function(){
const jacob = randInt(7,15);
const diff = randInt(3,8);
const filip = jacob + diff;
const total = jacob + filip;
const q = `Filip is ${diff} years older than Jacob.\nTogether they are ${formatNumber(total)} years old.\nHow old are Jacob and Filip?`;
const steps =
`Let x be Jacob's age.

Filip is x + ${diff}

x + (x + ${diff}) = ${formatNumber(total)}
2x + ${diff} = ${formatNumber(total)}
2x = ${formatNumber(total)} - ${diff} = ${formatNumber(total-diff)}
x = ${formatNumber(jacob)}

So:
Jacob = ${formatNumber(jacob)} years
Filip = ${formatNumber(filip)} years`;
return normalizeProblem({
question:q,
answers:[
{ label:"Jacob", value:jacob },
{ label:"Filip", value:filip }
],
steps,
tier:"easy"
});
}
];

const mediumGenerators = [
function(){
const letterWeight = randInt(10,40);
const lettersCount = 6;
const packageWeight = randInt(400,800);
const total = lettersCount * letterWeight + packageWeight;
const q = `Six letters and one package together weigh ${formatNumber(total)} g.\nThe package alone weighs ${formatNumber(packageWeight)} g.\nAll letters have the same weight.\nHow much does one letter weigh?`;
const steps =
`Let x be the weight of one letter.

${lettersCount}x + ${formatNumber(packageWeight)} = ${formatNumber(total)}
${lettersCount}x = ${formatNumber(total)} - ${formatNumber(packageWeight)} = ${formatNumber(total-packageWeight)}
x = ${formatNumber(total-packageWeight)} ÷ ${lettersCount} = ${formatNumber(letterWeight)} g`;
return normalizeProblem({
question:q,
answer:letterWeight,
steps,
tier:"medium"
});
},

function(){
const factor = randInt(4,7);
const child = randInt(5,15);
const father = factor * child;
const extra = father - child;
const q = `Sara's father is ${factor} times as old as Sara.\nHe is also ${extra} years older than Sara.\nHow old are they?`;
const steps =
`Let x be Sara's age.

Father is ${factor}x and also x + ${extra}

${factor}x = x + ${extra}
${factor}x - x = ${extra}
${factor-1}x = ${extra}
x = ${extra} ÷ ${factor-1} = ${formatNumber(child)}

So:
Sara = ${formatNumber(child)} years
Father = ${formatNumber(father)} years`;
return normalizeProblem({
question:q,
answers:[
{ label:"Sara", value:child },
{ label:"Father", value:father }
],
steps,
tier:"medium"
});
},

function(){
const original = randInt(400,1200) * 10;
const diff = original * 0.30;
const q = `The price of a sofa was lowered by 30% and became ${formatNumber(diff)} kr cheaper.\nWhat was the price of the sofa before the reduction?`;
const steps =
`Let P be the original price.

30% of P = ${formatNumber(diff)}
0.30P = ${formatNumber(diff)}
P = ${formatNumber(diff)} ÷ 0.30 = ${formatNumber(original)} kr`;
return normalizeProblem({
question:q,
answer:original,
steps,
tier:"medium"
});
},

function(){
const x = randInt(5,20);
const b = 3*x;
const c = x + 15;
const total = x + b + c;
const q = `Three boxes contain marbles.\nBox A has x marbles, box B has three times as many as box A, and box C has 15 more marbles than box A.\nAltogether there are ${formatNumber(total)} marbles.\nHow many marbles are in box A?`;
const steps =
`Let x be the number of marbles in box A.

Box B: 3x
Box C: x + 15

x + 3x + (x + 15) = ${formatNumber(total)}
5x + 15 = ${formatNumber(total)}
5x = ${formatNumber(total)} - 15 = ${formatNumber(total-15)}
x = ${formatNumber(total-15)} ÷ 5 = ${formatNumber(x)}`;
return normalizeProblem({
question:q,
answer:x,
steps,
tier:"medium"
});
},

function(){
const longSide = randInt(8,20);
const triangleBase = longSide - 3;
const q = `A rectangle and an isosceles triangle have related side lengths.\nThe base of the triangle is 3 cm shorter than the long side of the rectangle.\nThe long side of the rectangle is ${formatNumber(longSide)} cm.\nHow long is the base of the triangle?`;
const steps =
`Let x be the base of the triangle.

x + 3 = ${formatNumber(longSide)}
x = ${formatNumber(longSide)} - 3 = ${formatNumber(triangleBase)} cm`;
return normalizeProblem({
question:q,
answer:triangleBase,
steps,
tier:"medium"
});
},

function(){
const first = randInt(10,35) * 2;
const second = first + 2;
const third = first + 4;
const sum = first + second + third;
const q = `The sum of three consecutive even numbers is ${formatNumber(sum)}.\nWhat are the three numbers?`;
const steps =
`Let x be the smallest even number.

The next two consecutive even numbers are x + 2 and x + 4.

x + (x + 2) + (x + 4) = ${formatNumber(sum)}
3x + 6 = ${formatNumber(sum)}
3x = ${formatNumber(sum)} - 6 = ${formatNumber(sum-6)}
x = ${formatNumber(sum-6)} ÷ 3 = ${formatNumber(first)}

So the three numbers are:
${formatNumber(first)}, ${formatNumber(second)}, ${formatNumber(third)}`;
return normalizeProblem({
question:q,
answers:[
{ label:"Smallest even number", value:first },
{ label:"Next even number", value:second },
{ label:"Largest even number", value:third }
],
steps,
tier:"medium"
});
},

function(){
const yearsAgo = randInt(3,7);
const fredNow = 2 * yearsAgo;
const lisaNow = 4 * fredNow;
const q = `Lisa is four times as old as her son Fredrik.\n${yearsAgo} years ago she was seven times as old as he was.\nHow old are they now?`;
const steps =
`Let x be Fredrik's age now.

Lisa is 4x.

${yearsAgo} years ago:
Fredrik: x - ${yearsAgo}
Lisa: 4x - ${yearsAgo}

At that time Lisa was seven times as old:
4x - ${yearsAgo} = 7(x - ${yearsAgo})
4x - ${yearsAgo} = 7x - ${7*yearsAgo}
Move terms:
-3x + ${6*yearsAgo} = 0
3x = ${6*yearsAgo}
x = ${6*yearsAgo} ÷ 3 = ${formatNumber(fredNow)}

So:
Fredrik = ${formatNumber(fredNow)} years
Lisa = ${formatNumber(lisaNow)} years`;
return normalizeProblem({
question:q,
answers:[
{ label:"Fredrik", value:fredNow },
{ label:"Lisa", value:lisaNow }
],
steps,
tier:"medium"
});
}
];

const hardGenerators = [
function(){
const original = randInt(500,2000) * 4;
const spent = (3/4) * original;
const q = `Elin used three quarters of her money to buy a bicycle for ${formatNumber(spent)} kr.\nHow much money did Elin have to begin with?`;
const steps =
`Let x be the amount of money Elin had.

She spent 3/4 of it on the bicycle:
(3/4)x = ${formatNumber(spent)}

x = ${formatNumber(spent)} × 4 ÷ 3 = ${formatNumber(original)} kr`;
return normalizeProblem({
question:q,
answer:original,
steps,
tier:"hard"
});
},

function(){
const first = 39;
const second = 26;
const q = `The number 65 is split into two smaller numbers.\nIf you multiply the first number by 2 and the second number by 3, the results are the same.\nWhat are the two numbers?`;
const steps =
`Let x be the first number.
Then the second number is 65 - x.

Because 2 × (first number) = 3 × (second number):
2x = 3(65 - x)
2x = 195 - 3x
5x = 195
x = 39

So:
First number = 39
Second number = 26`;
return normalizeProblem({
question:q,
answers:[
{ label:"First number", value:first },
{ label:"Second number", value:second }
],
steps,
tier:"hard"
});
},

function(){
const moa = randInt(4,10);
const maria = 5 * moa;
const given = 2 * moa;
const q = `Maria had five times as many Star Wars cards as Moa.\nThen she gave ${given} cards to Moa.\nAfter that they had the same number of cards.\nHow many cards did each of them have at the beginning?`;
const steps =
`Let x be Moa's original number of cards.

Maria had 5x cards.

After giving ${given} cards:
Maria: 5x - ${given}
Moa: x + ${given}

They then have the same number:
5x - ${given} = x + ${given}
5x - x = ${given} + ${given}
4x = ${2*given}
x = ${2*given} ÷ 4 = ${formatNumber(moa)}

So:
Moa = ${formatNumber(moa)} cards
Maria = ${formatNumber(maria)} cards`;
return normalizeProblem({
question:q,
answers:[
{ label:"Moa", value:moa },
{ label:"Maria", value:maria }
],
steps,
tier:"hard"
});
},

function(){
const a = randInt(20,200);
const b = 2*a + 12;
const total = a + b;
const q = `Bag B contains twice as much money as bag A, plus an extra 12 kr.\nTogether the two bags contain ${formatNumber(total)} kr.\nHow much money is in each bag?`;
const steps =
`Let x be the amount in bag A.

Bag B has 2x + 12.

x + (2x + 12) = ${formatNumber(total)}
3x + 12 = ${formatNumber(total)}
3x = ${formatNumber(total)} - 12 = ${formatNumber(total-12)}
x = ${formatNumber(total-12)} ÷ 3 = ${formatNumber(a)}

So:
Bag A = ${formatNumber(a)} kr
Bag B = ${formatNumber(b)} kr`;
return normalizeProblem({
question:q,
answers:[
{ label:"Bag A", value:a },
{ label:"Bag B", value:b }
],
steps,
tier:"hard"
});
},

function(){
const anna = randInt(70,120);
const john = anna + 10;
const hours = 40;
const total = hours*anna + hours*john;
const q = `John and Anna work at a café.\nJohn has worked there longer than Anna and earns 10 kr more per hour than she does.\nIn a week when they each work ${hours} hours, they earn ${formatNumber(total)} kr altogether.\nWhat is the hourly wage for John and for Anna?`;
const steps =
`Let x be Anna's hourly wage.

John earns x + 10.

Together in a ${hours}-hour week:
${hours}x + ${hours}(x + 10) = ${formatNumber(total)}
${2*hours}x + ${hours*10} = ${formatNumber(total)}
${2*hours}x = ${formatNumber(total)} - ${hours*10}
${2*hours}x = ${formatNumber(total - hours*10)}
x = ${formatNumber(total - hours*10)} ÷ ${2*hours} = ${formatNumber(anna)}

So:
Anna = ${formatNumber(anna)} kr/hour
John = ${formatNumber(john)} kr/hour`;
return normalizeProblem({
question:q,
answers:[
{ label:"Anna", value:anna },
{ label:"John", value:john }
],
steps,
tier:"hard"
});
},

function(){
const original = randInt(3000,9000);
const afterPercent = original * 0.75;
const secondCut = randInt(20,200);
const final = afterPercent - secondCut;
const q = `The price of a film camera is first reduced by 25%.\nLater the price is reduced by another ${formatNumber(secondCut)} kr.\nThe camera now costs ${formatNumber(final)} kr.\nWhat was the original price?`;
const steps =
`Let P be the original price.

After a 25% reduction:
Price becomes 75% of P = 0.75P

Then the store subtracts ${formatNumber(secondCut)} kr:
0.75P - ${formatNumber(secondCut)} = ${formatNumber(final)}

0.75P = ${formatNumber(final)} + ${formatNumber(secondCut)} = ${formatNumber(final+secondCut)}
P = ${formatNumber(final+secondCut)} ÷ 0.75 = ${formatNumber(original)} kr`;
return normalizeProblem({
question:q,
answer:original,
steps,
tier:"hard"
});
},

function(){
const num5 = randInt(4,15);
const num10 = randInt(4,15);
const totalCoins = num5 + num10;
const totalValue = num5*5 + num10*10;
const q = `Yining has only 5-kr and 10-kr coins.\nIn total there are ${formatNumber(totalCoins)} coins, worth ${formatNumber(totalValue)} kr.\nHow many coins of each type does Yining have?`;
const steps =
`Let x be the number of 5-kr coins.

Then the number of 10-kr coins is ${totalCoins} - x.

Total value:
5x + 10(${totalCoins} - x) = ${formatNumber(totalValue)}
5x + ${10*totalCoins} - 10x = ${formatNumber(totalValue)}
-5x + ${10*totalCoins} = ${formatNumber(totalValue)}
-5x = ${formatNumber(totalValue)} - ${10*totalCoins}
-5x = ${formatNumber(totalValue - 10*totalCoins)}
x = ${formatNumber(num5)}

So:
5-kr coins = ${formatNumber(num5)}
10-kr coins = ${formatNumber(num10)}`;
return normalizeProblem({
question:q,
answers:[
{ label:"5-kr coins", value:num5 },
{ label:"10-kr coins", value:num10 }
],
steps,
tier:"hard"
});
},

function(){
const scooterOriginal = randInt(6000,12000);
const helmet = randInt(300,800);
const totalPaid = scooterOriginal * 0.90 + helmet;
const q = `Li bought a moped that was on sale with a 10% discount off the original price.\nShe also bought a helmet for ${formatNumber(helmet)} kr.\nIn total she paid ${formatNumber(totalPaid)} kr.\nWhat was the original price of the moped?`;
const steps =
`Let P be the original price of the moped.

The sale price is 90% of P:
0.90P

She also buys a helmet for ${formatNumber(helmet)} kr:
0.90P + ${formatNumber(helmet)} = ${formatNumber(totalPaid)}

0.90P = ${formatNumber(totalPaid)} - ${formatNumber(helmet)} = ${formatNumber(totalPaid-helmet)}
P = ${formatNumber(totalPaid-helmet)} ÷ 0.90 = ${formatNumber(scooterOriginal)} kr`;
return normalizeProblem({
question:q,
answer:scooterOriginal,
steps,
tier:"hard"
});
},

function(){
const youthTickets = randInt(40,120);
const adultTickets = youthTickets * 2;
const adultPrice = 50;
const youthPrice = 20;
const totalMoney = adultTickets*adultPrice + youthTickets*youthPrice;
const q = `For a football match, the club sold twice as many adult tickets as youth tickets.\nAdult tickets cost ${formatNumber(adultPrice)} kr and youth tickets cost ${formatNumber(youthPrice)} kr.\nAltogether the ticket sales brought in ${formatNumber(totalMoney)} kr.\nHow many tickets were sold in total?`;
const steps =
`Let x be the number of youth tickets.

Adult tickets: 2x

Total money:
${adultPrice}(2x) + ${youthPrice}x = ${formatNumber(totalMoney)}
${2*adultPrice}x + ${youthPrice}x = ${formatNumber(totalMoney)}
${2*adultPrice + youthPrice}x = ${formatNumber(totalMoney)}
x = ${formatNumber(totalMoney)} ÷ ${2*adultPrice + youthPrice} = ${formatNumber(youthTickets)}

Total tickets = x + 2x = 3x = ${formatNumber(adultTickets + youthTickets)}`;
return normalizeProblem({
question:q,
answer:adultTickets + youthTickets,
steps,
tier:"hard"
});
}
];

function generateProblem(tier) {
let actualTier = tier;
if (tier === "mixed") {
actualTier = choice(["easy","medium","hard"]);
}

let genArr;
if (actualTier === "easy") genArr = easyGenerators;
else if (actualTier === "medium") genArr = mediumGenerators;
else genArr = hardGenerators;

const gen = choice(genArr);
const problem = normalizeProblem(gen());
problem.tier = actualTier;
return problem;
}

let difficulty="easy";
let currentProblem=null;
let evaluated=false;
let correctCount=0,incorrectCount=0;

function parseStudentNumber(value){
  if(value==null)return null;
  const s=String(value).trim().replace(/\u00A0/g," ").replace(/\s+/g,"").replace(",",".");
  if(!s)return null;
  if(!/^-?\d+(?:\.\d+)?$/.test(s))return null;
  const n=Number(s);
  return Number.isFinite(n)?n:null;
}
function answerText(problem){
  return problem.answers.map(a=>`${a.label}: ${formatNumber(a.value)}`).join("\n");
}
function renderQuestion(){
  currentProblem=generateProblem(difficulty);
  evaluated=false;
  document.getElementById("question").textContent=currentProblem.question;
  const box=document.getElementById("answers");
  box.innerHTML="";
  currentProblem.answers.forEach((a,i)=>{
    const g=document.createElement("label");
    g.className="answer-group";
    const lab=document.createElement("span");
    lab.className="answer-label";
    lab.textContent=currentProblem.answers.length===1?"Answer":a.label;
    const inp=document.createElement("input");
    inp.type="text";
    inp.inputMode="decimal";
    inp.autocomplete="off";
    inp.dataset.index=i;
    inp.setAttribute("aria-label",lab.textContent);
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault();evaluated?renderQuestion():submit()}
      else if(e.key==="Escape"){e.preventDefault();clearInputs()}
    });
    g.append(lab,inp);box.appendChild(g);
  });
  document.getElementById("feedback").className="feedback";
  document.getElementById("feedback").textContent="Solve the problem and enter your answer.";
  document.getElementById("correctAnswer").className="correct-answer";
  document.getElementById("correctAnswer").textContent="";
  document.getElementById("steps").className="steps";
  document.getElementById("steps").textContent="";
  document.getElementById("submitBtn").disabled=false;
  document.getElementById("nextBtn").disabled=true;
  box.querySelector("input")?.focus();
}
function getInputs(){
  return [...document.querySelectorAll("#answers input")];
}
function submit(){
  if(evaluated||!currentProblem)return;
  const inputs=getInputs();
  const vals=inputs.map(i=>parseStudentNumber(i.value));
  if(vals.some(v=>v===null)){
    document.getElementById("feedback").className="feedback";
    document.getElementById("feedback").textContent=inputs.length===1
      ?"Enter a valid number."
      :"Enter a valid number in every answer field.";
    return;
  }
  const ok=currentProblem.answers.every((a,i)=>Math.abs(vals[i]-a.value)<1e-9);
  evaluated=true;
  inputs.forEach(i=>i.disabled=true);
  document.getElementById("submitBtn").disabled=true;
  document.getElementById("nextBtn").disabled=false;

  if(ok){
    correctCount++;
    document.getElementById("correct").textContent=correctCount;
    document.getElementById("feedback").className="feedback ok";
    document.getElementById("feedback").textContent="Correct!";
  }else{
    incorrectCount++;
    document.getElementById("incorrect").textContent=incorrectCount;
    document.getElementById("feedback").className="feedback bad";
    document.getElementById("feedback").textContent="Incorrect.";
    const ca=document.getElementById("correctAnswer");
    ca.textContent="Correct answer(s):\n"+answerText(currentProblem);
    ca.classList.add("show");
    const st=document.getElementById("steps");
    st.textContent=currentProblem.steps;
    st.classList.add("show");
  }
}
function clearInputs(){
  if(evaluated)return;
  getInputs().forEach(i=>i.value="");
  getInputs()[0]?.focus();
}

document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  difficulty=b.dataset.diff;
  renderQuestion();
}));
document.getElementById("newBtn").addEventListener("click",renderQuestion);
document.getElementById("submitBtn").addEventListener("click",submit);
document.getElementById("nextBtn").addEventListener("click",renderQuestion);
document.getElementById("clearBtn").addEventListener("click",clearInputs);

function showPractice(){
  document.getElementById("practiceTab").classList.add("active");
  document.getElementById("worksheetTab").classList.remove("active");
  document.getElementById("practiceCard").style.display="block";
  document.getElementById("worksheetCard").style.display="none";
}
function showWorksheet(){
  document.getElementById("worksheetTab").classList.add("active");
  document.getElementById("practiceTab").classList.remove("active");
  document.getElementById("practiceCard").style.display="none";
  document.getElementById("worksheetCard").style.display="block";
}
document.getElementById("practiceTab").addEventListener("click",showPractice);
document.getElementById("worksheetTab").addEventListener("click",showWorksheet);

function worksheetItem(p,i){
  const card=document.createElement("div");card.className="ws-item";
  const q=document.createElement("div");q.className="ws-q";q.textContent=`${i}. ${p.question}`;
  const a=document.createElement("div");a.className="ws-a";
  a.textContent=answerText(p);
  const btn=document.createElement("button");btn.type="button";btn.className="no-print";btn.textContent="Reveal";
  btn.addEventListener("click",()=>{a.classList.toggle("show");btn.textContent=a.classList.contains("show")?"Hide":"Reveal"});
  card.append(q,a,btn);return card;
}
function generateWorksheet(){
  const n=Number(document.getElementById("wsCount").value);
  const list=document.getElementById("wsList");list.innerHTML="";
  for(let i=1;i<=n;i++)list.appendChild(worksheetItem(generateProblem(difficulty),i));
  const names={easy:"Foundation",medium:"Core",hard:"Challenge"};
  document.getElementById("wsMeta").textContent=`${names[difficulty]} • ${n} questions`;
  document.getElementById("revealAll").disabled=false;
  document.getElementById("hideAll").disabled=false;
  document.getElementById("printBtn").disabled=false;
}
document.getElementById("wsGenerate").addEventListener("click",generateWorksheet);
document.getElementById("revealAll").addEventListener("click",()=>document.querySelectorAll(".ws-a").forEach(x=>x.classList.add("show")));
document.getElementById("hideAll").addEventListener("click",()=>document.querySelectorAll(".ws-a").forEach(x=>x.classList.remove("show")));
document.getElementById("printBtn").addEventListener("click",()=>window.print());

window.__MMM_TEST__={generateProblem,easyGenerators,mediumGenerators,hardGenerators};
renderQuestion();
</script>
